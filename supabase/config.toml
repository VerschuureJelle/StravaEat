[project]
# Set via: supabase link --project-ref <your-ref>

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[functions.strava-auth]
verify_jwt = false

[functions.strava-callback]
verify_jwt = false   # public endpoint — called by Strava directly, no JWT

[functions.sync-strava]
verify_jwt = true

[functions.sync-recent]
verify_jwt = true

[functions.google-cal-callback]
verify_jwt = false

[functions.microsoft-cal-callback]
verify_jwt = false

[functions.cal-webhook-receiver]
verify_jwt = false

[functions.cal-push-workout]
verify_jwt = true

[functions.cal-create-event]
verify_jwt = true

[functions.cal-delete-event]
verify_jwt = true

[functions.cal-update-event]
verify_jwt = true

[functions.hr-stream]
verify_jwt = true

[functions.cal-disconnect]
verify_jwt = true

[functions.cal-renew-subscriptions]
verify_jwt = false

[functions.cal-get-events]
verify_jwt = true
